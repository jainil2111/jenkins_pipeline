---
# Fails the build unless the manager reports the agent as Active.
- name: Verify agent enrollment on the manager
  hosts: wazuh_server
  become: true
  gather_facts: false
  vars:
    agent_name: "{{ groups['wazuh_agents'][0] }}"

  tasks:
    - name: Wait for agent to show as Active
      ansible.builtin.shell: >
        /var/ossec/bin/agent_control -l | grep -F "Name: {{ agent_name }},"
      register: agent_status
      until: agent_status.rc == 0 and 'Active' in agent_status.stdout
      retries: 18
      delay: 10
      changed_when: false

    - name: Agent status
      ansible.builtin.debug:
        msg: "{{ agent_status.stdout | trim }}"