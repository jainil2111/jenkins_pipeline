# Installs an all-in-one Wazuh server (indexer + manager + Filebeat + dashboard) from YOUR packages
# in the lab apt repo, following the official Wazuh 4.14 step-by-step installation.
#
# Speed layout (dpkg allows only one install at a time, so installs are batched; everything else overlaps):
#   1. Internet downloads (Filebeat, its module, filebeat.yml, alerts template) run in the BACKGROUND
#      while apt installs indexer + manager + dashboard in ONE transaction from the lab repo.
#   2. All configuration is written before any service starts (no CPU fight with a running manager).
#   3. Indexer and manager start TOGETHER; Filebeat and dashboard start TOGETHER.
#   Plus: dpkg force-unsafe-io, no man-db / needrestart scans, no fact gathering.
#
# Variables (passed by the deploy-wazuh-server Jenkins job):
#   lab_repo_url          lab apt repo                         (default http://192.168.11.20/wazuh-repo)
#   wazuh_template_url    wazuh-template.json from YOUR wazuh fork at the pinned commit
#   clean_install         true = remove any existing Wazuh install first (destructive)
---
- name: Deploy Wazuh all-in-one server from the lab repo
  hosts: wazuh_server
  become: true
  gather_facts: false            # nothing below uses facts; saves a round of probing

  vars:
    node_ip: "{{ ansible_host }}"
    lab_repo_url: "http://192.168.11.20/wazuh-repo"
    clean_install: false
    min_free_gb: 15              # the manager's vulnerability database alone needs ~11 GB
    # Node names used in the certificates (must match config.yml below)
    indexer_node: node-1
    server_node: wazuh-1
    dashboard_node: dashboard
    # Default credentials of a step-by-step install (to be replaced by strong passwords later)
    indexer_user: admin
    indexer_password: admin
    # Not one of your forks: Elastic's Filebeat OSS build and Wazuh's Filebeat module, as in the official guide
    filebeat_deb_url: "https://packages.wazuh.com/4.x/apt/pool/main/f/filebeat/filebeat-oss-7.10.2-amd64.deb"
    filebeat_yml_url: "https://packages.wazuh.com/4.14/tpl/wazuh/filebeat/filebeat.yml"
    filebeat_module_url: "https://packages.wazuh.com/4.x/filebeat/wazuh-filebeat-0.5.tar.gz"
    wazuh_template_fallback_url: "https://raw.githubusercontent.com/wazuh/wazuh/v4.14.10/extensions/elasticsearch/7.x/wazuh-template.json"
    certs_dir: /root/wazuh-certs
    staging: /root/wazuh-staging   # kept across clean installs: the Filebeat .deb is downloaded only once
    apt_env:
      NEEDRESTART_SUSPEND: "1"     # skip the slow "which services need restarting" scan after each install
      DEBIAN_FRONTEND: noninteractive

  tasks:
    # ------------------------------------------------------------------ 0. pre-checks + optional clean-up
    - name: Check free disk space
      ansible.builtin.shell: df --output=avail -BG / | tail -1 | tr -dc '0-9'
      register: free_gb
      changed_when: false

    - name: Stop early if the disk is too small
      ansible.builtin.assert:
        that: free_gb.stdout | int >= min_free_gb
        fail_msg: "Only {{ free_gb.stdout }} GB free on / - need at least {{ min_free_gb }} GB. Grow the disk first."
        success_msg: "{{ free_gb.stdout }} GB free on /"

    - name: Clean install - stop services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: [wazuh-dashboard, filebeat, wazuh-manager, wazuh-indexer]
      failed_when: false
      when: clean_install | bool

    - name: Clean install - purge packages
      ansible.builtin.apt:
        name: [wazuh-dashboard, filebeat, wazuh-manager, wazuh-indexer]
        state: absent
        purge: true
      environment: "{{ apt_env }}"
      when: clean_install | bool

    - name: Clean install - remove leftover data and config
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/wazuh-indexer
        - /usr/share/wazuh-indexer
        - /etc/wazuh-indexer
        - /var/ossec
        - /etc/filebeat
        - /var/lib/filebeat
        - /usr/share/filebeat
        - /etc/wazuh-dashboard
        - /usr/share/wazuh-dashboard
        - /var/lib/wazuh-dashboard
        - "{{ certs_dir }}"
        - /root/.wazuh-indexer-initialized
      when: clean_install | bool

    # ------------------------------------------------------------------ 1. faster package installs
    - name: dpkg - skip fsync on every file (big win for the dashboard's ~50k files)
      ansible.builtin.copy:
        dest: /etc/dpkg/dpkg.cfg.d/99-lab-unsafe-io
        content: "force-unsafe-io\n"
        mode: "0644"

    - name: Skip man-db index rebuilds after installs
      ansible.builtin.shell: echo 'man-db man-db/auto-update boolean false' | debconf-set-selections
      changed_when: false

    - name: Add the lab apt repo (your own packages)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/wazuh-lab.list
        content: "deb [trusted=yes] {{ lab_repo_url }}/ ./\n"
        mode: "0644"

    # ------------------------------------------------------------------ 2. downloads (background) + installs
    - name: Create the download folder
      ansible.builtin.file:
        path: "{{ staging }}"
        state: directory
        mode: "0700"

    - name: Background - download Filebeat, its module, filebeat.yml and the alerts template
      ansible.builtin.shell: |
        set -e
        cd {{ staging }}
        get() { curl -fsSL --retry 3 --connect-timeout 15 -o "$2.tmp" "$1" && mv "$2.tmp" "$2"; }
        [ -s filebeat.deb ]       || get "{{ filebeat_deb_url }}"    filebeat.deb
        [ -s filebeat-module.tgz ] || get "{{ filebeat_module_url }}" filebeat-module.tgz
        get "{{ filebeat_yml_url }}" filebeat.yml
        if get "{{ wazuh_template_url | default(wazuh_template_fallback_url) }}" wazuh-template.json; then
          echo "fork (pinned commit)" > template.source
        else
          get "{{ wazuh_template_fallback_url }}" wazuh-template.json
          echo "official v4.14.10 fallback" > template.source
        fi
      async: 900
      poll: 0
      register: downloads

    - name: Install prerequisites
      ansible.builtin.apt:
        name: [tar, curl, libcap2-bin, debconf, adduser, procps]
        state: present
        update_cache: true
      environment: "{{ apt_env }}"

    - name: Install wazuh-indexer, wazuh-manager and wazuh-dashboard from the lab repo (one transaction)
      ansible.builtin.apt:
        name: [wazuh-indexer, wazuh-manager, wazuh-dashboard]
        state: latest
      environment: "{{ apt_env }}"

    - name: Wait for the background downloads
      ansible.builtin.async_status:
        jid: "{{ downloads.ansible_job_id }}"
      register: downloads_job
      until: downloads_job.finished
      retries: 90
      delay: 10

    - name: Install Filebeat
      ansible.builtin.apt:
        deb: "{{ staging }}/filebeat.deb"
      environment: "{{ apt_env }}"

    # ------------------------------------------------------------------ 3. certificates
    - name: Create the certificates working folder
      ansible.builtin.file:
        path: "{{ certs_dir }}"
        state: directory
        mode: "0700"

    - name: Copy the certificate tool shipped inside your indexer package
      ansible.builtin.copy:
        src: /usr/share/wazuh-indexer/plugins/opensearch-security/tools/wazuh-certs-tool.sh
        dest: "{{ certs_dir }}/wazuh-certs-tool.sh"
        remote_src: true
        mode: "0700"

    - name: Write config.yml for the certificate tool
      ansible.builtin.copy:
        dest: "{{ certs_dir }}/config.yml"
        mode: "0600"
        content: |
          nodes:
            indexer:
              - name: {{ indexer_node }}
                ip: "{{ node_ip }}"
            server:
              - name: {{ server_node }}
                ip: "{{ node_ip }}"
            dashboard:
              - name: {{ dashboard_node }}
                ip: "{{ node_ip }}"

    - name: Generate the certificates (only once)
      ansible.builtin.command:
        cmd: bash ./wazuh-certs-tool.sh -A
        chdir: "{{ certs_dir }}"
        creates: "{{ certs_dir }}/wazuh-certificates/root-ca.pem"

    - name: Create the certs folders
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "0500"
      loop:
        - { path: /etc/wazuh-indexer/certs,   owner: wazuh-indexer }
        - { path: /etc/filebeat/certs,        owner: root }
        - { path: /etc/wazuh-dashboard/certs, owner: wazuh-dashboard }

    - name: Deploy certificates (indexer, Filebeat, dashboard)
      ansible.builtin.copy:
        src: "{{ certs_dir }}/wazuh-certificates/{{ item.src }}"
        dest: "{{ item.dir }}/{{ item.dest }}"
        remote_src: true
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "0400"
      loop:
        - { dir: /etc/wazuh-indexer/certs,   owner: wazuh-indexer,   src: "{{ indexer_node }}.pem",       dest: indexer.pem }
        - { dir: /etc/wazuh-indexer/certs,   owner: wazuh-indexer,   src: "{{ indexer_node }}-key.pem",   dest: indexer-key.pem }
        - { dir: /etc/wazuh-indexer/certs,   owner: wazuh-indexer,   src: admin.pem,                      dest: admin.pem }
        - { dir: /etc/wazuh-indexer/certs,   owner: wazuh-indexer,   src: admin-key.pem,                  dest: admin-key.pem }
        - { dir: /etc/wazuh-indexer/certs,   owner: wazuh-indexer,   src: root-ca.pem,                    dest: root-ca.pem }
        - { dir: /etc/filebeat/certs,        owner: root,            src: "{{ server_node }}.pem",        dest: filebeat.pem }
        - { dir: /etc/filebeat/certs,        owner: root,            src: "{{ server_node }}-key.pem",    dest: filebeat-key.pem }
        - { dir: /etc/filebeat/certs,        owner: root,            src: root-ca.pem,                    dest: root-ca.pem }
        - { dir: /etc/wazuh-dashboard/certs, owner: wazuh-dashboard, src: "{{ dashboard_node }}.pem",     dest: dashboard.pem }
        - { dir: /etc/wazuh-dashboard/certs, owner: wazuh-dashboard, src: "{{ dashboard_node }}-key.pem", dest: dashboard-key.pem }
        - { dir: /etc/wazuh-dashboard/certs, owner: wazuh-dashboard, src: root-ca.pem,                    dest: root-ca.pem }

    # ------------------------------------------------------------------ 4. configuration (nothing running yet)
    - name: Indexer - node address and name
      ansible.builtin.lineinfile:
        path: /etc/wazuh-indexer/opensearch.yml
        regexp: "{{ item.re }}"
        line: "{{ item.line }}"
      loop:
        - { re: '^network\.host:', line: 'network.host: "{{ node_ip }}"' }
        - { re: '^node\.name:',    line: 'node.name: "{{ indexer_node }}"' }

    - name: Manager - indexer credentials in the keystore
      ansible.builtin.shell: |
        echo '{{ indexer_user }}'     | /var/ossec/bin/wazuh-keystore -f indexer -k username
        echo '{{ indexer_password }}' | /var/ossec/bin/wazuh-keystore -f indexer -k password
      no_log: true
      changed_when: false

    - name: Manager - point the indexer connection at this node
      ansible.builtin.replace:
        path: /var/ossec/etc/ossec.conf
        regexp: '<host>https://0\.0\.0\.0:9200</host>'
        replace: '<host>https://{{ node_ip }}:9200</host>'

    - name: Filebeat - config, alerts template
      ansible.builtin.copy:
        src: "{{ staging }}/{{ item.src }}"
        dest: "/etc/filebeat/{{ item.src }}"
        remote_src: true
        mode: "{{ item.mode }}"
      loop:
        - { src: filebeat.yml,        mode: "0600" }
        - { src: wazuh-template.json, mode: "0644" }

    - name: Filebeat - point at this node's indexer
      ansible.builtin.replace:
        path: /etc/filebeat/filebeat.yml
        regexp: 'hosts: \[.*\]'
        replace: 'hosts: ["{{ node_ip }}:9200"]'

    - name: Filebeat - keystore with the indexer credentials
      ansible.builtin.shell: |
        filebeat keystore create --force
        echo '{{ indexer_user }}'     | filebeat keystore add username --stdin --force
        echo '{{ indexer_password }}' | filebeat keystore add password --stdin --force
      no_log: true
      changed_when: false

    - name: Filebeat - Wazuh module
      ansible.builtin.unarchive:
        src: "{{ staging }}/filebeat-module.tgz"
        dest: /usr/share/filebeat/module
        remote_src: true

    - name: Dashboard - indexer address
      ansible.builtin.lineinfile:
        path: /etc/wazuh-dashboard/opensearch_dashboards.yml
        regexp: '^opensearch\.hosts:'
        line: 'opensearch.hosts: https://{{ node_ip }}:9200'

    - name: Dashboard - Wazuh app config folder
      ansible.builtin.file:
        path: /usr/share/wazuh-dashboard/data/wazuh/config
        state: directory
        owner: wazuh-dashboard
        group: wazuh-dashboard
        mode: "0750"

    - name: Dashboard - connection to the Wazuh server API
      ansible.builtin.copy:
        dest: /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
        owner: wazuh-dashboard
        group: wazuh-dashboard
        mode: "0600"
        content: |
          hosts:
            - default:
                url: https://127.0.0.1
                port: 55000
                username: wazuh-wui
                password: wazuh-wui
                run_as: true

    # ------------------------------------------------------------------ 5. start (in parallel where possible)
    - name: Reload systemd units
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start wazuh-indexer and wazuh-manager together
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        enabled: true
      loop: [wazuh-indexer, wazuh-manager]
      async: 600
      poll: 0
      register: core_start

    - name: Wait for the indexer port
      ansible.builtin.wait_for:
        host: "{{ node_ip }}"
        port: 9200
        timeout: 300

    - name: Initialize the indexer security (only once)
      ansible.builtin.shell: |
        /usr/share/wazuh-indexer/bin/indexer-security-init.sh && touch /root/.wazuh-indexer-initialized
      args:
        creates: /root/.wazuh-indexer-initialized

    - name: Test the indexer
      ansible.builtin.uri:
        url: "https://{{ node_ip }}:9200"
        user: "{{ indexer_user }}"
        password: "{{ indexer_password }}"
        force_basic_auth: true
        validate_certs: false
      register: indexer_info
      retries: 10
      delay: 10
      until: indexer_info.status == 200

    - name: Start Filebeat and wazuh-dashboard together
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        enabled: true
      loop: [filebeat, wazuh-dashboard]
      async: 600
      poll: 0
      register: edge_start

    - name: Confirm all four services started
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ core_start.results + edge_start.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: start_jobs
      until: start_jobs.finished
      retries: 60
      delay: 5

    - name: Test Filebeat -> indexer connection
      ansible.builtin.command: filebeat test output
      register: fb_test
      changed_when: false
      retries: 6
      delay: 10
      until: fb_test.rc == 0

    - name: Wait for the dashboard port
      ansible.builtin.wait_for:
        host: "{{ node_ip }}"
        port: 443
        timeout: 300

    # ------------------------------------------------------------------ 6. summary
    - name: Installed versions and template source
      ansible.builtin.shell: |
        dpkg-query -W -f='${Package} ${Version}\n' wazuh-indexer wazuh-manager wazuh-dashboard filebeat
        echo "alerts template: $(cat {{ staging }}/template.source)"
      register: versions
      changed_when: false

    - name: Done
      ansible.builtin.debug:
        msg:
          - "{{ versions.stdout_lines }}"
          - "Dashboard: https://{{ node_ip }}  (user: {{ indexer_user }} / password: {{ indexer_password }})"
